name: Build

# Prevent multiple builds from running simultaneously
concurrency:
  group: build
  cancel-in-progress: true

# Build triggers
on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

# Allow GitHub Actions to publish generated files
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source repository
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          path: src

      # Checkout builds branch
      - name: Checkout Builds
        uses: actions/checkout@v7
        with:
          ref: builds
          path: builds

      # Remove old plugin files
      - name: Clean Old Builds
        run: rm -f "$GITHUB_WORKSPACE/builds/"*.cs3

      # Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Build CloudStream Plugins
      - name: Build Plugins
        working-directory: src
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew --no-daemon make makePluginsJson

          test -f build/plugins.json

          mapfile -t plugin_files < <(find . -type f -path '*/build/*.cs3')

          if [ "${#plugin_files[@]}" -eq 0 ]; then
            echo "ERROR: No .cs3 plugin files were generated."
            exit 1
          fi

          cp "${plugin_files[@]}" "$GITHUB_WORKSPACE/builds/"
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"

      # Publish generated files
      - name: Push Builds
        working-directory: builds
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "No generated changes to publish."
          else
            git commit --amend -m "Build ${BUILD_SHA}"
            git push --force origin HEAD:builds
          fi
